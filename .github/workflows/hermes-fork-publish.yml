name: Hermes Fork Publish

# fork 전용 이미지 publish — amd64 네이티브 러너에서 빌드·push (로컬 QEMU 불필요).
# 트리거:
#   - 태그 push: v<버전>-hermes<N> (예: v0.15.1-hermes2)  → 그 태그명을 이미지 태그로 사용
#   - 수동(workflow_dispatch): tag 입력으로 임의 태그 publish
# 시크릿 필요(repo Settings → Secrets):
#   DOCKERHUB_USERNAME  (예: tae1560)
#   DOCKERHUB_TOKEN     (dockerhub Personal Access Token)
# push 는 이 워크플로(태그/수동)에서만 — 일반 브랜치 push 에서는 빌드/검증만 하는
# hermes-fork-verify.yml 과 역할 분리.
on:
  push:
    tags:
      - 'v*-hermes*'
  workflow_dispatch:
    inputs:
      tag:
        description: '이미지 태그 (예: v0.15.1-hermes2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"   # 태그 push 시 태그명
          fi
          if [ -z "$TAG" ]; then echo "FAIL: 빈 태그"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/hermes-agent:$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Docker Hub login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64 + push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=fork-publish-amd64
          cache-to: type=gha,mode=max,scope=fork-publish-amd64

      - name: Smoke the pushed image
        uses: ./.github/actions/hermes-smoke-test
        with:
          image: ${{ steps.tag.outputs.image }}

      - name: Summary
        run: echo "Published ${{ steps.tag.outputs.image }} (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
